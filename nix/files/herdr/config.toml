# Managed in ~/src/mark/tilde and linked into ~/.config/herdr by Home Manager.
# Changes made through Herdr's settings UI are written back to this file.

onboarding = false

[keys]
prefix = "backtick"
previous_tab = "prefix+,"
next_tab = "prefix+."

[theme]
name = "rose-pine"
auto_switch = false

[ui]
sidebar_start_collapsed = true
sidebar_max_width = 45
prompt_new_tab_name = false

[ui.toast]
delivery = "system"
delay_seconds = 1
