# Shared Codex Desktop/CLI starter config. Home Manager seeds this only when
# missing; Codex owns the writable local file and subsequent settings changes.
# Desktop uses OpenAI/ChatGPT authentication. ~/bin/codex selects the separate
# cloudflare-cli.config.toml profile for CLI sessions, never a global default.

personality = "pragmatic"
model_provider = "openai"

[tui]
status_line = ["model-with-reasoning", "context-remaining"]

[plugins."notion@openai-curated"]
enabled = true
